<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Omar Aydah — Backend, Data &amp; AI Infrastructure">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip"><rect x="150" y="150" width="600" height="30"><animate attributeName="width" values="0;600;600" keyTimes="0;0.55;1" dur="4s" begin="0.4s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="nameClip"><rect x="0" y="0" width="900" height="240" rx="16"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect x="1.5" y="1.5" width="897" height="237" rx="16" fill="#0b0a12" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="897" height="237" rx="16" fill="url(#scan)"/>
  <!-- ambient glow blob -->
  <ellipse cx="720" cy="40" rx="240" ry="120" fill="#3b82f6" opacity="0.10"/>

  <!-- moving scanline -->
  <g clip-path="url(#nameClip)">
    <rect x="0" y="0" width="900" height="46" fill="#60a5fa" opacity="0.06">
      <animateTransform attributeName="transform" type="translate" from="0 -46" to="0 240" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- corner HUD labels -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="12" letter-spacing="2">
    <text x="30" y="40" fill="#60a5fa" opacity="0.85">OMARAYDAH.DEV</text>
    <g>
      <circle cx="762" cy="36" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="775" y="40" fill="#7dd3fc" opacity="0.85">SYS://ONLINE</text>
    </g>
    <text x="30" y="212" fill="#6d6a7d">LOC: WASHINGTON, D.C.</text>
    <text x="870" y="212" fill="#6d6a7d" text-anchor="end">BUILD // 2027</text>
  </g>

  <!-- big name: glowing back copy + crisp front -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-weight="bold" font-size="78" letter-spacing="6" text-anchor="middle">
    <text x="450" y="120" fill="url(#blue)" filter="url(#glow)" opacity="0.75">
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="2.6s" repeatCount="indefinite"/>OMAR
    </text>
    <text x="450" y="120" fill="url(#blue)">OMAR</text>
    <!-- sheen sweep over the name -->
    <g clip-path="url(#nameClip)">
      <rect x="-300" y="60" width="200" height="90" fill="url(#sheen)" opacity="0.5" transform="skewX(-18)">
        <animate attributeName="x" values="-300;1100" dur="3.8s" begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- status line, typed reveal + blinking cursor -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="16" letter-spacing="3">
    <g clip-path="url(#typeClip)">
      <text x="152" y="172" fill="#e4e4e7">&gt; BACKEND · DATA · AI-INFRASTRUCTURE</text>
    </g>
    <rect x="700" y="158" width="10" height="18" fill="#60a5fa">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
